<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>student card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        color: #454545;
      }
      h1 {
        text-align: center;
        margin: 30px 0;
        text-transform: uppercase;
      }
      img {
        display: block;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
      }
      .student-list {
        width: 100%;
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .card {
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: calc((100% - 20px) / 3);
        border: 1px solid #f0f0f0;
        background-color: #fff;
        cursor: pointer;
        transition: 0.3s;
      }
      .card .img {
        border-radius: 100%;
        overflow: hidden;
        box-shadow: 0 0 4px #e0e0e0;
        cursor: pointer;
      }
      .card img {
        transition: 0.3s;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      .card:hover img {
        transform: scale(1.02);
      }
      .card p {
        font-size: 14px;
        color: #808080;
      }
      .card .name {
        margin: 20px 0;
        font-size: 18px;
        font-weight: bold;
        color: #454545;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: #00000040;
        display: flex;
        align-items: center;
        justify-content: center;
        display: none;
      }
      .modal-cnt {
        position: relative;
        width: 360px;
        background-color: #fff;
        padding: 30px;
        border-radius: 10px;
      }
      .close {
        position: absolute;
        right: 15px;
        top: 10px;
        padding: 5px;
        font-size: 20px;
        font-weight: bold;
        color: #a0a0a0;
        cursor: pointer;
      }
      #detail {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #detail .img {
        width: 150px;
        height: 150px;
        margin: 0 auto;
      }
      #detail img {
        width: 100%;
        height: 100%;
      }
      .desc p {
        font-size: 14px;
        line-height: 1.5;
        color: #808080;
        margin-bottom: 5px;
      }
      .desc p span {
        width: 60px;
        margin-right: 20px;
        display: inline-block;
        font-weight: bold;
      }
      .desc .name {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>student information management</h1>
    <div class="container">
      <div class="student-list" id="studentList"></div>
    </div>
    <div class="modal" id="modal">
      <div class="modal-cnt">
        <div class="close">&times;</div>
        <div id="detail"></div>
      </div>
    </div>
    <script>
      const studentList = document.querySelector("#studentList");
      const modal = document.querySelector(".modal");
      const modalCnt = document.querySelector("#detail");
      const closeBtn = document.querySelector(".close");

      fetch("data/students.json")
        .then((res) => {
          return res.json();
        })
        .then((data) => {
          studentList.innerHTML = data
            .map((item) => {
              return `
          <div class="card">
            <div class="img">
              <img src="${item.image}" alt="${item.name}_profile" />
            </div>
            <p class="name">${item.name}</p>
            <p>${item.major}</p>
            </div>
            `;
            })
            .join("");
          const cardEl = document.querySelectorAll(".card");

          cardEl.forEach((card, index) => {
            card.addEventListener("click", () => {
              // const student = data[index]
              modal.style.display = "flex";
              modalCnt.innerHTML = `
              <div class="img">
                <img src="${data[index].image}" alt="${data[index].name}_profile" />
              </div>
              <div class="desc">
                <p class="name">${data[index].name}</p>
                <p><span>ID</span>${data[index].id}</p>
                <p><span>전공</span>${data[index].major}</p>
                <p><span>전화번호</span>${data[index].phone}</p>
                <p><span>e-mail</span>${data[index].email}</p>
              </div>
              `;
            });
          });
        })
        .catch((err) => {});
      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });
    </script>
  </body>
</html>
