<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        color: #454545;
      }
      h1 {
        text-align: center;
        text-transform: capitalize;
      }
      button {
        width: 200px;
        display: block;
        margin: 30px auto;
        padding: 10px 20px;
        text-align: center;
        font-size: 15px;
        border: none;
        background-color: #454545;
        color: #f4f5f6;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background-color: #3b3a39;
      }
      #result {
        width: 100%;
        max-width: 800px;
        margin: 0 auto 50px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .card {
        width: calc(50% - 20px);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 0 4px #cdd1d580;
        font-size: 15px;
      }
      .card h3 {
        margin-bottom: 30px;
      }
      .card p {
        display: flex;
        flex-direction: column;
      }
      .card p strong {
        font-size: 14px;
        color: #a0a0a0;
      }
    </style>
  </head>
  <body>
    <h1>get user data</h1>
    <button id="loadBtn">get data</button>
    <div id="result"></div>
    <script>
      const loadBtn = document.querySelector("#loadBtn");
      const result = document.querySelector("#result");

      loadBtn.addEventListener("click", () => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            return res.json();
          })
          .then((data) => {
            result.innerHTML = data
              .map((item) => {
                return `
                  <div class="card">
                    <h3>${item.id}. ${item.name}</h3>
                    <p><strong>Mail</strong>${item.email}</p>
                    <p><strong>UserName</strong>${item.usename}</p>
                    <p><strong>Phone</strong>${item.phone}</p>
                    <p><strong>WebSite</strong>${item.website}</p>
                    <p><strong>Address</strong>
                      ${item.address.city} / ${item.address.street} / ${item.address.suite}
                    </p>
                    <p><strong>ZipCode</strong>${item.address.zipcode}</p>
                    <p><strong>Company</strong>${item.company.name}</p>
                  </div>`;
              })
              .join("");
          })
          .catch((err) => {
            console.log("!error!");
          });
      });
    </script>
  </body>
</html>
