<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #result {
        max-width: 720px;

          //     </div>
          //   `;
          //   })

          const result = document.querySelector("#result");
          result.innerHTML = data
