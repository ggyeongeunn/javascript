<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul id="list"></ul>
    <script>
      const products = ["apple", "banana", "graph", "strawberry"];
      const proList = document.querySelector("#list");

      for (let i = 0; i < products.length; i++) {
        proList.innerHTML += `<li>${products[i]}</li>`;
      }
    </script>
  </body>
</html>
