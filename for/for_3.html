<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      for (let i = 2; i < 10; i++) {
        document.write(`<h3>${i}</h3>`);
        for (let j = 1; j < 10; j++) {
          document.write(`<p>${i} * ${j} = ${i * j}</p>`);
        }
      }
    </script>
  </body>
</html>
