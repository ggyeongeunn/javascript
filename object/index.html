<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>object</title>
  </head>
  <body>
    <script>
      // 객체 - 여러가지 정보를 하나로 묶어 놓은 것
      // 내장 객체 - 자바스크립트가 미리 만들어 놓은 객체
      // Date, Array, String, Math

      // 1. String
      const str = "Hello, World!";
      console.log(str);
      console.log(str.length); // 길이 확인 속성
      console.log(str.toLocaleLowerCase());
      console.log(str.toLocaleUpperCase());
      console.log(str.includes("World")); // 해당 내용이 포함되어 있는지
      console.log("==================================================");

      // 2. Array
      const arr = [1, 2, 3, 4];
      console.log(arr);
      console.log(arr.length);
      console.log(arr.push(5));
      console.log(arr); // [1, 2, 3, 4, 5]
      console.log(arr.join("/")); // 1/2/3/4/5
      console.log("==================================================");

      // 3. Date
      const today = new Date();
      console.log(today);
      console.log(today.getDate());
      console.log(today.getDay()); //  0부터 시작(요일)
      console.log(today.getMonth() + 1); //  0부터 시작
      console.log(today.toDateString());
      console.log(today.toLocaleDateString());
      console.log(today.getFullYear());
      console.log("==================================================");

      // 4. Math
      console.log(Math.PI);
      console.log(Math.max(10, 23, 100, 50));
      console.log(Math.min(10, 23, 100, 50));
      console.log(Math.random()); // 0 ~ 1 사이 난수
    </script>
  </body>
</html>
