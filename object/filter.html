<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filter()</title>
  </head>
  <body>
    <script>
      // filter() : 조건에 맞는 데이터만 골라내는 메서드
      const scores = [10, 20, 30, 40, 50];
      const passed = scores.filter((score) => {
        return score >= 30;
      });
      console.log(passed);

      const prices = [3000, 8000, 5000, 12000, 4000];
      console.log(prices);
      const result = prices.filter((price) => {
        return price <= 5000;
      });

      document.write(result);
      // map : 변환 / filter : 원하는 조건만
    </script>
  </body>
</html>
