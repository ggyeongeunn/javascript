<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>math object</title>
  </head>
  <body>
    <script>
      let num = 2.223;
      let maxNum = Math.max(10, 5, 8, 30);
      let minNum = Math.min(10, 5, 8, 30);

      let roundNum = Math.round(num); // 소수점 첫째자리에서 반올림
      let floorNum = Math.floor(num); //  소수점 버리고 내림
      let ceilNum = Math.ceil(num); //  소수점을 올림하여 정수로 변환
      let randomNum = Math.random(); //  0 ~ 1 사이의 난수
      let piNum = Math.PI; // 원주율
      console.log(piNum);
    </script>
  </body>
</html>
