<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>string filter</title>
  </head>
  <body>
    <h2>상품 검색</h2>
    <!-- 검색창 -->
    <input type="text" id="search" placeholder="상품 이름을 입력하세요" />
    <ul id="productList"></ul>
    <script>
      const products = ["티셔츠", "청바지", "운동화", "모자", "원피스"];
      const search = document.querySelector("#search");
      const productList = document.querySelector("#productList");

      // 상품 출력 함수
      function showProductList(items) {
        productList.innerHTML = "";
        items.forEach((product) => {
          productList.innerHTML += `<li>${product}</li>`;
        });
      }
      // input
      search.addEventListener("input", () => {
        const keyword = search.value.trim();
        // 글자가 포함된 상품만 찾기
        const result = products.filter((product) => {
          return product.includes(keyword);
          // return product === keyword;
        });
        if (keyword === "") {
          productList.innerHTML = "";
        }

        showProductList(result);
        console.log(result);
        
      });
      // showProductList(products);
    </script>
  </body>
</html>
