<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>modal</title>
    <style>
      button {
        width: 200px;
        padding: 10px 20px;
        margin: 100px auto;
        display: block;
        border: none;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: -0.025em;
        text-transform: capitalize;
        border-radius: 10px;
        background-color: #f4f5f6;
        color: #454545;
        box-shadow: 0 0 10px #e0e0e0;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background-color: #f0f0f0;
      }
      h2 {
        margin-top: 0;
      }
      * {
        box-sizing: border-box;
      }
      .modal {
        width: 100%;
        height: 100%;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 9;
        background-color: #00000040;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
        display: none;
      }
      .modal-cnt {
        width: 400px;
        border-radius: 20px;
        background-color: #fff;
        box-sizing: border-box;
        padding: 20px;
        position: relative;
      }
      .modal-cnt span {
        width: 100%;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background-color: #f4f5f6;
        text-transform: uppercase;
        font-size: 15px;
        font-weight: bold;
        color: #454545;
        cursor: pointer;
        transition: 0.3s;
      }
      .modal-cnt span:hover {
        background-color: #eee;
      }
      .modal-cnt p {
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <button class="openBtn">open modal</button>
    <div class="modal">
      <div class="modal-cnt">
        <h2>modal window</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nisi,
          reprehenderit inventore. Eligendi similique distinctio impedit,
          placeat officiis nisi nesciunt. Rerum!
        </p>
        <span class="closeBtn">close</span>
      </div>
    </div>
    <script>
      const openBtn = document.querySelector(".openBtn");
      const closeBtn = document.querySelector(".closeBtn");
      const modal = document.querySelector(".modal");

      openBtn.addEventListener("click", () => {
        modal.style.display = "flex";
      });

      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });
      // background click
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          // modal.style.display = "none";
          e.target.style.display = "none";
        }
      });
    </script>
  </body>
</html>
