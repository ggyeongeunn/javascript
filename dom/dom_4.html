<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      img {
        transition: 0.3s;
      }
      #cover2 {
        transform: scale(0.8);
      }
    </style>
  </head>
  <body>
    <img src="images/easys-1.jpg" alt="img" id="cover" />
    <script>
      const cover = document.querySelector("#cover");
      console.log(cover);
      console.log(cover.src);
      console.log(cover.alt);
      cover.addEventListener("mouseover", (e) => {
        // cover.setAttribute("src", "images/easys-2.jpg");
        console.log(e.target.src);
        cover.src = "images/easys-2.jpg";
        cover.id = "cover2";
      });
      cover.addEventListener("mouseout", () => {
        cover.src = "images/easys-1.jpg";
        cover.id = "cover";
      });
    </script>
  </body>
</html>
