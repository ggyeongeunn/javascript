<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab</title>
    <style>
      .tab-btn {
        display: inline-block;
        padding: 8px 20px;
        margin: 30px 0 -1px;
        border: 1px solid #cdd1d5;
        background-color: #f4f5f6;
        transition: 0.3s;
        cursor: pointer;
      }
      .tab-content {
        max-width: 500px;
        height: 20vh;
        border: 1px solid #cdd1d5;
        padding: 20px;
        display: none;
      }
      .tab-btn:hover,
      .tab-btn.active {
        border: 1px solid #4787e7;
        background-color: #4787e7;
        color: #f4f5f6;
      }
      .tab-content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <button class="tab-btn">tab 1</button>
    <button class="tab-btn">tab 2</button>
    <button class="tab-btn">tab 3</button>
    <div class="tab-content">tab content 1</div>
    <div class="tab-content">tab content 2</div>
    <div class="tab-content">tab content 3</div>
    <script>
      const tabs = document.querySelectorAll(".tab-btn");
      const contents = document.querySelectorAll(".tab-content");
      
      // class setting
      tabs[0].classList.add("active");
      contents[0].classList.add("active");

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => {
          // class reset
          tabs.forEach((t) => {
            t.classList.remove("active");
          });
          tab.classList.add("active");
          contents.forEach((c) => {
            c.classList.remove("active");
          });
          contents[index].classList.add("active");

          // // tab content
          // contents.forEach((content, cntId) => {
          //   if (tabId === cntId) {
          //     contents.forEach((c) => {
          //       c.classList.remove("active");
          //     });
          //     content.classList.add("active");
          //   }
          // });
        });
      });
    </script>
  </body>
</html>
