<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>variable_2</title>
    <style>
      span {
        color: #a0a0a0;
      }
    </style>
  </head>
  <body>
    <script>
      // 변수 연산
      let x = 200;
      let y = 50;
      let total = x + y;
      document.write(`<p>x + y = <span>${total}</span></p>`);
      total = x - y;
      document.write(`<p>x - y = <span>${total}</span></p>`);
      total = x * y;
      document.write(`<p>x * y = <span>${total}</span></p>`);
      total = x / y;
      document.write(`<p>x / y = <span>${total}</span></p>`);
      total = x % y;
      document.write(`<p>x % y = <span>${total}</span></p>`);
      // + - * / %
    </script>
  </body>
</html>
