<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>switch_2</title>
  </head>
  <body>
    <script>
      let site = prompt("naver, google, youtube / potal site is");
      let url;
      switch (site) {
        case "google":
          url = "https://www.google.co.kr";
          // console.log
          break;
        case "naver":
          url = "https://www.naver.com";
          break;
        case "youtube":
          url = "https://www.youtube.com";
          break;
        default:
          alert("site error");
      }
      // location.href = url;
      // location.replace(url);
      window.open(`${url}`, "_self");
    </script>
  </body>
</html>
