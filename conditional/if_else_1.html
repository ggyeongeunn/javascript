<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>if else</title>
  </head>
  <body>
    <script>
      // if 기본 구조
      // if
      // if
      let age = 25;
      if (age < 20) {
        console.log("미성년자 입니다");
      } else {
        console.log("성인입니다");
      }
    </script>
  </body>
</html>
