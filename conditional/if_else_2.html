<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>if else</title>
  </head>
  <body>
    <script>
      let score = 900;
      if (score >= 90) {
        console.log("A");
      } else if (score >= 80) {
        console.log("B");
      } else {
        console.log("C");
      }
    </script>
  </body>
</html>
